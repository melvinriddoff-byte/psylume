<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF7F4" />
    <meta
      name="description"
      content="Psylume is a psychotherapy consultation platform for adults facing everyday emotional and relational struggles. Meet a therapist online or in person."
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (WhatsApp, Instagram, LinkedIn, X). Pages update title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Psylume" />
    <meta property="og:title" content="Psylume · Psychotherapy online and in person" />
    <meta
      property="og:description"
      content="Psylume is a psychotherapy consultation platform for adults facing everyday emotional and relational struggles. Meet a therapist online or in person."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Psylume · Psychotherapy online and in person</title>

    <!--
      Brand fonts
      Primary   (headlines): Bricolage Grotesque, Google Fonts, open source (OFL)
      Secondary (body):      Satoshi, Fontshare (ITF Free Font License), served from Fontshare's own API
      Malayalam:             Anek Malayalam, Google Fonts, open source (OFL)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
